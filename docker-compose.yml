services:
  postgres:
    image: postgres:16-alpine
    container_name: olicmat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: olicmat
      POSTGRES_PASSWORD: olicmat_dev
      POSTGRES_DB: olicmat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: olicmat-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://olicmat:olicmat_dev@postgres:5432/olicmat?connection_limit=100
      JWT_SECRET: dev_secret_change_in_production
      EXAM_APP_URL: http://localhost:3006
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: olicmat-web
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  exam-backend:
    build:
      context: ./exam-backend
      dockerfile: Dockerfile
    container_name: olicmat-exam-api
    restart: unless-stopped
    ports:
      - "3334:3334"
    environment:
      DATABASE_URL: postgresql://olicmat:olicmat_dev@postgres:5432/olicmat?connection_limit=100
      JWT_SECRET: dev_secret_change_in_production
      PORT: 3334
    depends_on:
      postgres:
        condition: service_started

  exam-frontend:
    build:
      context: ./exam-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_EXAM_API_URL=http://localhost:3334/api
        - NEXT_PUBLIC_DISABLE_EXAM_GUARD=true
    container_name: olicmat-exam-web
    restart: unless-stopped
    ports:
      - "3006:3003"
    environment:
      NEXT_PUBLIC_EXAM_API_URL: http://localhost:3334/api
      NEXT_PUBLIC_DISABLE_EXAM_GUARD: "true"
    depends_on:
      - exam-backend

volumes:
  pgdata:
