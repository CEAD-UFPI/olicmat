# Réplica ISOLADA da topologia de produção para o teste de carga da Fase 1.
# Banco, rede e portas próprios: não toca no compose de desenvolvimento.
#   nginx (router) -> admin-web / admin-api / exam-web -> exam-api -> postgres
# DB_POOL_SIZE=10 é o valor de .env.prod.example; postgres com max_connections
# padrão (100). Os limites de CPU são conservadores: as specs reais das
# máquinas da UFPI não estão documentadas no repositório.
name: olicmat-lt

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://olicmat:carga@postgres:5432/olicmat?schema=public
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  JWT_SECRET: teste-de-carga-apenas-local-nao-usar-em-producao-0123456789

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: olicmat, POSTGRES_PASSWORD: carga, POSTGRES_DB: olicmat }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olicmat -d olicmat"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:15433:5432"]
    cpus: 2
    mem_limit: 2g
    volumes: [ltpg:/var/lib/postgresql/data]

  admin-api:
    build: { context: ../.., dockerfile: apps/admin/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *api-env
      PORT: 3333
      FRONTEND_URL: http://admin.olicmat.cead.ufpi.br
      EXAM_APP_URL: http://prova.olicmat.cead.ufpi.br
      UPLOAD_DIR: /tmp/uploads
      PUBLIC_API_URL: http://olicmat.cead.ufpi.br
      EMAIL_PROVIDER: smtp
    cpus: 2
    mem_limit: 2g

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: /api }
    environment: { NODE_ENV: production }
    cpus: 1
    mem_limit: 1g

  exam-api:
    build: { context: ../.., dockerfile: apps/exam/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *api-env
      PORT: 3334
    cpus: 2
    mem_limit: 1g

  exam-web:
    build:
      context: ../..
      dockerfile: apps/exam/web/Dockerfile
      args:
        NEXT_PUBLIC_EXAM_API_URL: /api
        NEXT_PUBLIC_MAIN_APP_URL: http://admin.olicmat.cead.ufpi.br
    environment:
      NODE_ENV: production
      EXAM_API_URL: http://exam-api:3334/api
    cpus: 1
    mem_limit: 1g

  router:
    image: nginx:alpine
    depends_on: [admin-api, admin-web, exam-web]
    ports: ["127.0.0.1:18080:80"]
    volumes: ["./router.conf:/etc/nginx/conf.d/default.conf:ro"]
    cpus: 1

volumes:
  ltpg:
