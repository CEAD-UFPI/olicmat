# ============================================================================
# OLICMAT — Roteador interno da Máquina 1
#
# Existe porque o proxy externo (NPM do CEAD) encaminha TODOS os domínios do
# OLICMAT para a porta 80 desta máquina. Este nginx recebe na 80 e distribui
# por domínio para o container correto.
#
# Sem ele, admin.olicmat.* e prova.olicmat.* caem na landing, que não tem as
# rotas desses sistemas — o sintoma é um 404 do Next.js em /login.
#
# Quando o NPM passar a apontar cada domínio para a porta certa, este serviço
# pode ser removido sem prejuízo.
# ============================================================================

# O resolver do Docker permite reavaliar o nome do serviço a cada requisição.
# Sem isso o nginx resolveria os upstreams só no boot e continuaria falando
# com um IP morto depois de um redeploy dos containers.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---- Landing pública + API (domínio principal e fallback) ------------------
# É o default_server: qualquer Host não reconhecido cai aqui, preservando o
# comportamento atual em vez de devolver erro.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # API de Cadastro/Configurações — prefixo global /api no NestJS,
    # repassado intacto.
    location /api/ {
        set $upstream_api admin-api:3333;
        proxy_pass http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---- Painel de Cadastro/Configurações -------------------------------------
server {
    listen 80;
    server_name admin.olicmat.cead.ufpi.br;

    client_max_body_size 25m;

    location / {
        set $upstream_admin admin-web:3000;
        proxy_pass http://$upstream_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---- Módulo de Provas (Máquina 2) -----------------------------------------
server {
    listen 80;
    server_name prova.olicmat.cead.ufpi.br;

    client_max_body_size 25m;

    location / {
        set $upstream_exam 10.42.90.243:3003;
        proxy_pass http://$upstream_exam$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Uma prova é sessão longa; timeout curto derrubaria o aluno.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
