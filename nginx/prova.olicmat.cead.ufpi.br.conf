# ============================================================================
# OLICMAT — Máquina 1 (10.42.2.55)
# Módulo de Provas — proxy para a Máquina 2 (10.42.90.243)
#
# Este é o ÚNICO tráfego que cruza máquinas no plano HTTP. O TLS termina aqui,
# na Máquina 1; daqui até a Máquina 2 o tráfego segue em HTTP simples pela
# rede interna 10.42.0.0/16.
#
# A Máquina 2 precisa publicar o exam-web fora do loopback para este
# proxy_pass funcionar — é o que faz EXAM_WEB_BIND_IP=10.42.90.243 no .env
# de lá. Com bind em 127.0.0.1 o nginx recebe "connection refused" e a prova
# fica inacessível.
#
# Instalar:
#   sudo cp nginx/prova.olicmat.cead.ufpi.br.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d prova.olicmat.cead.ufpi.br
# ============================================================================

upstream olicmat_exam_web {
    server 10.42.90.243:3003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name prova.olicmat.cead.ufpi.br;

    client_max_body_size 25m;

    access_log /var/log/nginx/olicmat-prova.access.log;
    error_log  /var/log/nginx/olicmat-prova.error.log;

    location / {
        proxy_pass http://olicmat_exam_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Uma prova é uma sessão longa. Timeouts curtos derrubariam o aluno no
        # meio do envio; o buffer desligado evita atraso na resposta do salvamento.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
