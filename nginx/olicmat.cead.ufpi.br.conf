# ============================================================================
# OLICMAT — Máquina 1 (10.42.2.55)
# Host público: landing + API de Cadastro/Configurações
#
# A landing e a API dividem o MESMO host de propósito: assim as chamadas do
# navegador são same-origin e não passam por CORS. O admin-api libera uma
# única origem cruzada (FRONTEND_URL), que fica reservada para o painel.
#
# Instalar:
#   sudo cp nginx/olicmat.cead.ufpi.br.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d olicmat.cead.ufpi.br
#
# O certbot injeta o bloco TLS e o redirect 80 -> 443 neste próprio arquivo.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name olicmat.cead.ufpi.br;

    # Comprovantes de matrícula e envios da Fase 2 (pdf, doc, docx, jpg, png).
    # O padrão do nginx é 1m — pequeno demais, rejeitaria a maioria dos anexos
    # com 413 antes mesmo de chegar na aplicação.
    client_max_body_size 25m;

    access_log /var/log/nginx/olicmat.access.log;
    error_log  /var/log/nginx/olicmat.error.log;

    # ---- API de Cadastro/Configurações (NestJS, prefixo global /api) --------
    # Sem URI no proxy_pass, o caminho original é repassado intacto: uma
    # requisição a /api/health chega no Nest como /api/health.
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Landing pública (Next.js) -----------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
