# Espelho da OLICMAT na VPS (contorno para quem não alcança a rede da UFPI,
# ex.: clientes da Claro). Repassa tudo ao servidor oficial e reescreve, nas
# páginas e scripts, os endereços oficiais para os do espelho, para o navegador
# continuar falando só com a VPS.
#
#   olicmat.q7zbrj.easypanel.host        → https://olicmat.cead.ufpi.br       (site + /api)
#   painel-olicmat.q7zbrj.easypanel.host → https://admin.olicmat.cead.ufpi.br (painel)
#                                          + /api → https://olicmat.cead.ufpi.br/api
# O TLS público é do Traefik do EasyPanel (certificado curinga); aqui é HTTP.

upstream ufpi { server 201.131.10.225:443; keepalive 32; }

# A API só aceita a Origin oficial do painel: quem chega pelo espelho é
# apresentado com ela (só quando o navegador mandou Origin).
map $http_origin $origem_oficial {
  ""      "";
  default "https://admin.olicmat.cead.ufpi.br";
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_session_reuse on;
proxy_connect_timeout 15s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 20m;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
# Sem compressão vinda da origem, para o sub_filter conseguir reescrever.
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter_types text/html text/css application/javascript text/javascript application/json text/x-component;
gzip on;
gzip_types text/css application/javascript text/javascript application/json text/x-component image/svg+xml;

server {
  listen 80;
  server_name olicmat.q7zbrj.easypanel.host;

  location / {
    proxy_pass https://ufpi;
    proxy_ssl_name olicmat.cead.ufpi.br;
    proxy_set_header Host olicmat.cead.ufpi.br;
    proxy_set_header Origin $origem_oficial;
    proxy_redirect https://olicmat.cead.ufpi.br/ /;
    proxy_redirect https://admin.olicmat.cead.ufpi.br/ https://painel-olicmat.q7zbrj.easypanel.host/;
    sub_filter 'https://admin.olicmat.cead.ufpi.br' 'https://painel-olicmat.q7zbrj.easypanel.host';
    sub_filter 'https://olicmat.cead.ufpi.br' 'https://olicmat.q7zbrj.easypanel.host';
  }
}

server {
  listen 80;
  server_name painel-olicmat.q7zbrj.easypanel.host;

  # API pelo mesmo endereço do painel (mesma origem: sem CORS no navegador).
  location /api/ {
    proxy_pass https://ufpi;
    proxy_ssl_name olicmat.cead.ufpi.br;
    proxy_set_header Host olicmat.cead.ufpi.br;
    proxy_set_header Origin $origem_oficial;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    sub_filter 'https://admin.olicmat.cead.ufpi.br' 'https://painel-olicmat.q7zbrj.easypanel.host';
  }

  location / {
    proxy_pass https://ufpi;
    proxy_ssl_name admin.olicmat.cead.ufpi.br;
    proxy_set_header Host admin.olicmat.cead.ufpi.br;
    proxy_set_header Origin $origem_oficial;
    proxy_redirect https://admin.olicmat.cead.ufpi.br/ /;
    proxy_redirect https://olicmat.cead.ufpi.br/ https://olicmat.q7zbrj.easypanel.host/;
    # Nenhum padrão é prefixo de outro (o nginx não escolhe o mais longo).
    sub_filter 'https://olicmat.cead.ufpi.br/api' 'https://painel-olicmat.q7zbrj.easypanel.host/api';
    sub_filter 'https://admin.olicmat.cead.ufpi.br' 'https://painel-olicmat.q7zbrj.easypanel.host';
    sub_filter 'https://olicmat.cead.ufpi.br"' 'https://olicmat.q7zbrj.easypanel.host"';
  }
}
