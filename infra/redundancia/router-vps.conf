# ============================================================================
# OLICMAT — Roteador da VPS (standby)
#
# Igual ao nginx/router.conf de produção, com UMA diferença: o Módulo de
# Provas roda LOCALMENTE aqui (exam-web:3003), e não na rede interna da UFPI.
#
# O proxy do CEAD (NPM) encaminha TODOS os domínios OLICMAT para a porta 80
# desta VPS; este nginx distribui por domínio para o container correto.
# ============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# ---- Landing pública + API (domínio principal e fallback) ------------------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        set $upstream_api admin-api:3333;
        proxy_pass http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---- Painel de Cadastro/Configurações -------------------------------------
server {
    listen 80;
    server_name admin.olicmat.cead.ufpi.br;

    client_max_body_size 25m;

    location / {
        set $upstream_admin admin-web:3000;
        proxy_pass http://$upstream_admin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---- Módulo de Provas (local na VPS) --------------------------------------
server {
    listen 80;
    server_name prova.olicmat.cead.ufpi.br;

    client_max_body_size 25m;

    location / {
        set $upstream_exam exam-web:3003;
        proxy_pass http://$upstream_exam$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Uma prova é sessão longa; timeout curto derrubaria o aluno.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
