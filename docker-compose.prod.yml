# ============================================================================
# OLICMAT v2.1 — Docker Compose (PRODUÇÃO — Máquina 1)
#
# Máquina 1 é a ÚNICA com acesso externo (reverse proxy).
# Roda aqui: Módulo WEB (landing) + Módulo Cadastro/Configurações.
#
#   - postgres  : opcional — em produção o banco vive na Máquina 3 (rede interna)
#   - admin-api : Cadastro/Configurações (NestJS)      127.0.0.1:3333
#   - admin-web : Cadastro/Configurações (Next.js)     127.0.0.1:3001
#   - web       : WEB — landing pública (Next.js)      127.0.0.1:3000
#
# O Módulo Provas (exam-api + exam-web) roda na Máquina 2 — veja
# docker-compose.exam.prod.yml. Ambas as APIs compartilham o mesmo JWT_SECRET
# e o mesmo PostgreSQL (Máquina 3).
#
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

name: olicmat-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: olicmat-db
    restart: unless-stopped
    # Em produção o banco vive na Máquina 3 (rede interna 10.42.0.x).
    # Se o banco rodar junto nesta máquina, descomente o bloco abaixo e
    # mantenha DATABASE_URL apontando para "postgres:5432".
    profiles: ["with-db"]
    environment:
      POSTGRES_USER: ${DB_USER:-olicmat}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-olicmat}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-olicmat} -d ${DB_NAME:-olicmat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-api:
    build:
      context: .
      dockerfile: apps/admin/api/Dockerfile
    container_name: olicmat-admin-api
    restart: unless-stopped
    # APP_BIND_IP define em qual interface os serviços são publicados.
    # 127.0.0.1 (padrão) serve quando o reverse proxy roda NESTA máquina.
    # Quando o proxy é externo — um Nginx Proxy Manager em outro host, por
    # exemplo — defina o IP interno desta máquina (ex.: 10.42.2.55), senão o
    # proxy recebe "connection refused" no loopback.
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${ADMIN_API_HOST_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://olicmat.cead.ufpi.br}
      EXAM_APP_URL: ${EXAM_APP_URL:-https://prova.olicmat.cead.ufpi.br}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3333/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: .
      dockerfile: apps/admin/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://olicmat.cead.ufpi.br/api}
    container_name: olicmat-admin-web
    restart: unless-stopped
    depends_on:
      - admin-api
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${ADMIN_WEB_HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://olicmat.cead.ufpi.br/api}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.olicmat.cead.ufpi.br}
    container_name: olicmat-web
    restart: unless-stopped
    depends_on:
      - admin-api
    # WEB_HOST_PORT existe porque o proxy externo pode esperar a landing na
    # porta 80 do host, e não na 3000 (é o caso do NPM do CEAD).
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production

  # Roteador opcional (perfil "router").
  #
  # Necessário quando o proxy externo encaminha TODOS os domínios para uma
  # única porta desta máquina — é o caso do NPM do CEAD, que manda tudo para
  # a porta 80. Sem ele, admin.olicmat.* e prova.olicmat.* caem na landing.
  #
  #   docker compose -f docker-compose.prod.yml --profile router up -d
  #
  # Com o roteador ativo, NÃO defina WEB_HOST_PORT=80: quem ocupa a 80 passa
  # a ser este serviço.
  router:
    image: nginx:alpine
    container_name: olicmat-router
    restart: unless-stopped
    profiles: ["router"]
    depends_on:
      - web
      - admin-web
      - admin-api
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${ROUTER_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
